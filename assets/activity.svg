<svg viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status indicator">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .cursor { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="89" rx="6" fill="#0d0d0d" stroke="#232323"/>

  <circle cx="34" cy="45" r="5" fill="#c9915a" class="pulse"/>
  <text x="52" y="40" class="mono" font-size="13" fill="#9a9a9a">status</text>
  <text x="52" y="60" class="mono" font-size="15" fill="#ececea">currently building, currently breaking things</text>

  <rect x="640" y="45" width="9" height="18" fill="#c9915a" class="cursor"/>
  <text x="660" y="60" class="mono" font-size="14" fill="#6f6f6f">_</text>
</svg>
