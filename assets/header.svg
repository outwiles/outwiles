<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="outwiles — developer identity banner">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
      .cursor { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .line { animation: draw 1.8s ease-out forwards; }
      @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bgFade)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <text x="60" y="118" class="mono" font-size="15" fill="#8a8a8a" letter-spacing="4">DEVELOPER / EXPERIMENTER</text>

  <text x="58" y="178" class="sans" font-size="64" font-weight="700" fill="#ececea" letter-spacing="1">OUTWILES</text>
  <rect x="452" y="140" width="16" height="52" fill="#c9915a" class="cursor"/>

  <line x1="60" y1="205" x2="960" y2="205" stroke="#c9915a" stroke-width="1.5"
        stroke-dasharray="900" class="line"/>

  <text x="60" y="235" class="mono" font-size="14" fill="#6f6f6f">aashu · builds tools, automation, small experiments</text>
</svg>
